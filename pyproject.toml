[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-latent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nilearn>=0.14.0",
    "pybids>=0.22.0",
    "pandas==2.3.2",
    "numpy<2.5",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "formulaic>=1.2.2",
    "matplotlib>=3.11.1",
]

[tool.setuptools.packages.find]
include = ["task_latent"]
